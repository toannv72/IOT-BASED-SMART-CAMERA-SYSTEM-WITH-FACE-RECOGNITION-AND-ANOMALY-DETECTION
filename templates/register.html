<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - AI Surveillance</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
        }
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }
        .card {
            width: 100%;
            max-width: 400px;
            margin: 0 16px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            z-index: 2;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        @media (max-width: 440px) {
            .card {
                padding: 24px;
            }
        }
        h2 { font-weight: 600; margin-bottom: 24px; letter-spacing: -0.5px; }
        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .input-group i {
            position: absolute;
            bottom: 12px;
            left: 14px;
            color: var(--text-muted);
        }
        .input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 10px 10px 38px;
            color: #fff;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }
        .btn {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            box-shadow: 0 0 15px var(--primary);
            transform: translateY(-1px);
        }
        .alert {
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
        }
        .alert-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
        .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #a7f3d0; }
        .switch-link {
            display: block;
            margin-top: 20px;
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
            transition: 0.2s;
        }
        .switch-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="card">
        <h2>Đăng Ký Tài Khoản</h2>
        
        {% if error %}
        <div class="alert alert-danger"><i class="fas fa-exclamation-triangle"></i> {{ error }}</div>
        {% endif %}
        
        {% if success %}
        <div class="alert alert-success"><i class="fas fa-check-circle"></i> {{ success }}</div>
        {% endif %}
        
        <form action="/register" method="post">
            <div class="input-group">
                <label for="username">Tên tài khoản</label>
                <i class="fas fa-user"></i>
                <input type="text" id="username" name="username" placeholder="Nhập username..." required>
            </div>
            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Nhập password..." required>
            </div>
            <button type="submit" class="btn">Đăng Ký</button>
        </form>
        <a href="/login" class="switch-link">Đã có tài khoản? Đăng nhập</a>
    </div>
</body>
</html>
